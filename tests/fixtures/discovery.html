<!doctype html><html><head><meta charset="utf-8"><title>Discovery form</title>
<style>.hidden-file{position:absolute;left:-9999px}.fake{padding:6px;border:1px solid #888;cursor:pointer}</style></head>
<body><h1>Discovery form</h1>
<form action="/submit" method="post" onsubmit="return false">
<label>First name <input id="fn" name="fn" required></label>
<label for="em">Email</label><input id="em" type="email" aria-required="true" value="pre@fill.io">
<label>Country <select id="co" required><option value="">Choose</option><option>Italy</option><option>Iran</option></select></label>
<fieldset><legend>Need sponsorship?</legend><label><input type="radio" name="sp" value="y"> Yes</label><label><input type="radio" name="sp" value="n"> No</label></fieldset>
<label><input type="checkbox" id="ag"> I agree</label>
<label>Cover note <textarea id="cn" maxlength="500"></textarea></label>
<div><span class="fake" onclick="document.getElementById('cv').click()">Upload resume</span>
<input class="hidden-file" type="file" id="cv" aria-label="Resume" accept=".pdf" required></div>
<label>Cover letter <input type="file" id="cl"></label>
<button type="button">Next</button> <button type="submit">Submit application</button>
</form>
<iframe src="about:blank" title="frame"></iframe>
</body></html>
