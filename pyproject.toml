[project]
name = "application-assistant"
version = "0.1.0"
description = "Fills job applications in the user's Chrome and parks them one click before submission."
authors = [
    {name = "Maaz77", email = "abbaszadehmohammadamin@yahoo.com"}
]
requires-python = ">=3.11"
dependencies = [
    "jev-ultrafast-mcp (==0.1.5+aa6)",   # patched wheel in vendor/ (display:contents fix, DISCOVERY.md)
    "httpx (>=0.27)",
    "pydantic (>=2,<3)",
    "pypdf (>=4)",
    "python-dotenv (>=1.0)",
    "numbers-parser (>=4.19.0,<5.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
jev-ultrafast-mcp = { path = "vendor/jev_ultrafast_mcp-0.1.5+aa6-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest (>=8)",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: no browser, no network",
    "browser: throwaway headless Chrome, no model",
    "live_model: OpenRouter against local fixtures; needs --live",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
