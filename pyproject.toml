[project]
name = "application-assistant"
version = "0.1.0"
description = "Fills job applications in the user's Chrome and parks them one click before submission."
authors = [
    {name = "Maaz", email = "abbaszadehmohammadamin@yahoo.com"}
]
requires-python = ">=3.11"
dependencies = [
    "websockets (>=13)",                 # the owned driver's CDP transport (assistant/driver/cdp.py), P2
    "httpx (>=0.27)",                    # Kev's /v1/systemone, which is not an OpenAI endpoint
    "openai (>=3.26)",                   # the chat/completions transport (gateway._openai_post). Brings its own
                                         # HTTP stack, httpx2 — which is why tests/test_no_bypass.py seals both.
    "pydantic (>=2,<3)",
    "pypdf (>=4)",
    "python-dotenv (>=1.0)",
    "numbers-parser (>=4.19.0,<5.0.0)",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=8)",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: no browser, no network",
    "browser: throwaway headless Chrome, no model",
    "live_model: the local FreeLLMAPI router and Kev server against local fixtures; needs --live",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
