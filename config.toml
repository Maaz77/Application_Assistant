[paths]
base = "../.."                     # the repo root: holds Applications/, Profile.md, Job_Tracker.numbers
applications = "Applications"
pending_review = "Pending-Review"
needs_attention = "Needs-Attention"
profile = "Profile.md"
tracker = "Job_Tracker.numbers"
tracker_sheet = "Jobs"

[browser]
cdp_url = "http://127.0.0.1:9222"
chrome = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"   # tests only
max_actions = 2000
max_pages_per_job = 15

[models]                           # two servers on this machine, and nothing off it
# The OpenRouter and Vercel AI Gateway routes were removed on 2026-10-07: both were paid, and the FreeLLMAPI router
# serves the same OpenAI chat/completions shape from free provider tiers.

[models.freellmapi]                # FREELLMAPI_KEY. github.com/tashfeenahmed/freellmapi, started on this machine.
base_url = "http://127.0.0.1:31415/v1"
# Tried in turn (rotation.Rotation): the model that answered last goes first, and one that is out (rate-limited,
# overloaded, wrong output) hands over to the next; when none answers the job goes to Needs Attention.
# Name concrete model IDs, as the router's GET /v1/models lists them — NOT its own "auto", which picks whichever
# free model is up and so may pick one that ignores response_format and answers prose at HTTP 200 (live
# 2026-10-07). Only a model whose catalogue entry lists `response_format` honours the strict json_schema at all.
#
# The quota that runs out is the router's key for a *platform*, not a model ID ("All models exhausted: 1 route
# checked (1 rate-limited or on cooldown)"), so two IDs served by the same platform share one limit and rotating
# between them buys nothing. These five sit on four platforms — groq, google, huggingface (two), nvidia — which is
# what makes the rotation survive a tier going out. Verified against the real strict ANSWER_SCHEMA and system
# prompt on a 6-question page, live 2026-10-07: qwen3.8-27b 1.2 s, gemini-3.5-flash 2.5 s, kimi-k3 9.1 s,
# deepseek-v4-flash 11.1 s, muse-glimmer-30b 42.5 s. Fast ones lead, because the chat timeout is 45 s.
# Rejected: "auto" and laguna-s-2.1 (answered, but not to the schema — "output invalid").
llm_inference = ["qwen3.8-27b", "gemini-3.5-flash", "kimi-k3", "deepseek-v4-flash", "muse-glimmer-30b"]

[models.local]                     # Kev (github.com/jaredpalmer/kev) on this Mac: the System One decision API
# Start the server before a run: ./run_kev_server.command (it downloads the weights on the first start). On a 16 GB
# Mac use kev-0.8b; kev-4b and kev-9b are 32 GB machines. No key unless the server is started with KEV_API_KEY set.
# This is the only System One route: the FreeLLMAPI router serves chat only (POST /v1/systemone there is HTTP 404).
base_url = "http://127.0.0.1:8009"
system_one_decision_model = "kev-latest"   # the name the server answers to; --run picks which checkpoint it serves
# Kev was trained on states of up to 384 tokens and loses accuracy on long ones (its README, "What to Expect"), and
# a short state is also much faster on an Apple GPU. 12000 characters is about 3000 tokens.
state_chars = 12000
timeout = 120.0                    # seconds; one pass on an M3 is seconds, not the milliseconds of an H100

[limits]                           # one queue for every model request (gateway.py)
max_in_flight = 1                  # a run sent 222 System One requests in 19 min with 4 batches in flight (§13.1)
min_interval_s = 0.25              # seconds between the starts of two requests
max_attempts = 3                   # per request, and the only retry layer there is

[jev]
max_questions_per_request = 24     # above this a judgment is split, and the parts go one after another

[decider]
fallback = "chat"                  # "chat" | "none": who answers when the System One model fails (D19)

[policy]
prefill = "keep-if-silent"         # or "strict"
free_text_max_chars = 1500

[google]
